<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TextReadsFast</title>
    <!-- For the @font-face declarations. The reader's own rules are all scoped
         under `.trf-reader`, so none of them reach this page. -->
    <link rel="stylesheet" href="reader.css" />
    <style>
      :root {
        --bg: #fbfaf8;
        --text: #1c1b19;
        --muted: #8b8d90;
        --edge: rgba(0, 0, 0, 0.12);
        --accent: #c1442a;
        --hover: rgba(0, 0, 0, 0.04);
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181b;
          --text: #e8e6e3;
          --muted: #8b8d90;
          --edge: rgba(255, 255, 255, 0.14);
          --accent: #e4572e;
          --hover: rgba(255, 255, 255, 0.06);
        }
      }

      body {
        margin: 0;
        width: 264px;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Geist",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--edge);
      }

      header strong {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .switch {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
      }

      input[type="checkbox"] {
        accent-color: var(--accent);
      }

      #profiles {
        padding: 6px;
        max-height: 320px;
        overflow-y: auto;
      }

      .profile {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .profile:hover {
        background: var(--hover);
      }

      .profile small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      /* A dot rather than a tick: it reads as "current" without competing with
         the name for attention. */
      .profile[aria-current="true"] {
        font-weight: 600;
      }

      .profile[aria-current="true"]::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: 0.15em;
      }

      .profile[aria-current="true"] small {
        font-weight: 400;
        margin-left: 14px;
      }

      footer {
        border-top: 1px solid var(--edge);
        padding: 8px 6px;
      }

      footer button {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
      }

      footer button:hover {
        background: var(--hover);
        color: inherit;
      }

      /* Read mode is the headline action here, not another link. */
      #read-mode {
        color: inherit;
        font-weight: 600;
      }

      footer svg {
        flex: none;
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.75;
      }

      footer button:hover svg {
        opacity: 1;
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* "auto" sits with the action it modifies rather than in settings: it is
         about this button, and it is the kind of thing you change while looking
         at a video, not while reading a settings page. */
      .auto {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
      }

      .auto:hover {
        background: var(--hover);
      }

      #popup-note {
        margin: 4px 10px 0;
        font-size: 12px;
        color: var(--muted);
        min-height: 1em;
      }

      #popup-note:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>TextReadsFast</strong>
      <label class="switch">
        <span>On</span>
        <input type="checkbox" id="enabled" />
      </label>
    </header>
    <div id="profiles"></div>
    <footer>
      <div class="action-row">
        <button type="button" id="read-mode">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z M9 7h7 M9 11h7"
            />
          </svg>
          <span>Open read mode</span>
        </button>
        <label class="auto" title="Open read mode automatically on every video">
          <input type="checkbox" id="auto-read-mode" />
          <span>auto</span>
        </label>
      </div>

      <button type="button" id="open-library">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 6c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3Z M3 6v6c0 1.7 4 3 9 3s9-1.3 9-3V6 M3 12v6c0 1.7 4 3 9 3s9-1.3 9-3v-6"
          />
        </svg>
        <span>Library</span>
      </button>

      <button type="button" id="open-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"
          />
        </svg>
        <span>All settings…</span>
      </button>
      <p id="popup-note"></p>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
